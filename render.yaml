databases:
  - name: webcheck-db
    databaseName: webcheck_db
    region: ohio
    plan: free

services:
  - type: web
    name: advacheck
    runtime: docker
    region: ohio
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webcheck-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
      # ⚠️ Cambiar por la URL real del frontend en producción (ej: https://webcheck.onrender.com)
      - key: CORS_ORIGINS
        value: "*"
      # ── Llenar en el dashboard de Render ──
      - key: AZURE_OCR_ENDPOINT
        sync: false
      - key: AZURE_OCR_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
